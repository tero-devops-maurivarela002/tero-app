# Pipeline de CI/CD de tero-app (DEVOPS-25, 31, 34, 32, 38, 26, 27, 39, 28, 29)
#
# Corre en cada PR a develop/main y en cada push (merge) a develop, main y release/*.
# Git Flow (ADR-001): develop -> dev, release/* -> test, main -> prod.
# Etapas, encadenadas con "needs" (si una falla, las siguientes no corren):
#   1. gitleaks     -> busca secretos en TODO el historial de git
#   2. build-test   -> compila y corre los tests unitarios de cada servicio
#      semgrep      -> SAST: análisis estático de seguridad
#      trivy-fs     -> SCA: vulnerabilidades conocidas en las dependencias
#                      (build-test, semgrep y trivy-fs corren en paralelo)
#   3. sonarcloud   -> calidad de código + cobertura de los tests, con quality gate
#                      (necesita los reportes de cobertura de build-test). En release/*
#                      y main no analiza (plan Free): el job pasa sin correr Sonar.
#      integration  -> tests de integración con Newman (DEVOPS-39): levanta la
#                      tienda con docker compose en el runner y corre el flujo
#                      de compra (tests/integration/). Paralelo a sonarcloud.
#   4. docker-build -> construye la imagen de cada servicio, solo si pasaron
#                      build-test, semgrep, trivy-fs, sonarcloud E integration,
#                      y la escanea
#                      con Trivy image (DEVOPS-33): si tiene CRITICAL/HIGH con
#                      parche, el job falla y la imagen NO se publica. En un push
#                      a develop o release/* la publica en ECR con tag = SHA del
#                      commit (DEVOPS-26), salvo que ya exista. En un PR y en main
#                      solo se construye y se escanea: main NO publica, promueve.
#   5. deploy-dev   -> solo en push a develop (DEVOPS-27): registra una revisión
#                      nueva de cada task definition con la imagen :SHA, hace el
#                      rolling update en ECS, espera a que quede estable y hace
#                      un smoke test contra el ALB (scripts/desplegar-ecs.sh).
#   6. integration-dev -> la misma colección de Newman, ahora contra dev en AWS
#                      (DEVOPS-39). Si falla, el pipeline queda en rojo y esa
#                      versión no se promueve a test.
#   7. deploy-test  -> push a release/* (DEVOPS-28/29). Gate: el MISMO SHA tiene
#                      que tener integration-dev en verde. Despliega en test esa
#                      imagen (no se reconstruye) y corre integration-test.
#   8. deploy-prod  -> push a main (merge de release/* a main). Promueve el SHA de
#                      la rama release (2do padre del merge). Gate: ese SHA tiene
#                      que tener integration-test en verde. Pide APROBACIÓN manual
#                      (environment production) y después corre smoke-prod
#                      (Newman, solo la carpeta de lectura).
# Detalle en docs/cd/promocion.md.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

# Mínimo privilegio: el pipeline solo necesita leer el código.
permissions:
  contents: read

# Las actions se fijan por SHA de commit y no por tag (@v4): un tag se puede
# mover para que apunte a código malicioso, como pasó con tj-actions/changed-files.
# El comentario al lado dice qué versión es. Dependabot las mantiene al día.

# Si llega un commit nuevo al mismo PR o rama, se cancela el run anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 0 = traer todos los commits. Con el default (1) Gitleaks solo vería
          # el último commit y se le escaparían los secretos viejos (lab T09-02).
          fetch-depth: 0

      - name: Instalar Gitleaks (versión fija y checksum verificado)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$file" "$base/$file"
          curl --proto '=https' --tlsv1.2 -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks version

      - name: Gitleaks sobre todo el historial
        # Si encuentra un secreto, sale con código 1 y el pipeline falla.
        # --redact: el valor del secreto NO se imprime en el log.
        run: |
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  build-test:
    name: build-test (${{ matrix.service }})
    # No se compila nada si hay un secreto en el repo.
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Si falla un servicio, igual vemos el resultado de los demás.
      fail-fast: false
      matrix:
        include:
          - service: catalog
            lang: go
          - service: orders
            lang: go
          - service: cart
            lang: python
          - service: checkout
            lang: node-yarn
          - service: ui
            lang: node
          - service: admin
            lang: node
    defaults:
      run:
        working-directory: src/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---------- Go (catalog, orders) ----------
      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/${{ matrix.service }}/go.mod
          cache-dependency-path: src/${{ matrix.service }}/go.sum

      - name: Build (Go)
        if: matrix.lang == 'go'
        run: |
          go vet ./...
          go build ./...

      - name: Tests unitarios (Go)
        if: matrix.lang == 'go'
        run: go test -v -coverprofile=coverage.out ./...

      # ---------- Python (cart) ----------
      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/${{ matrix.service }}/requirements*.txt

      - name: Build (Python)
        if: matrix.lang == 'python'
        run: |
          pip install -r requirements-dev.txt
          python -m compileall -q app

      - name: Tests unitarios (Python)
        if: matrix.lang == 'python'
        run: python -m pytest -v tests --cov=app --cov-report=xml:coverage.xml

      # ---------- Node con npm (ui, admin) ----------
      - name: Setup Node (npm)
        if: matrix.lang == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json

      - name: Build (Node)
        if: matrix.lang == 'node'
        run: |
          npm ci
          npm run build

      - name: Tests unitarios (Node)
        if: matrix.lang == 'node'
        run: npm test --if-present

      # ---------- Node con Yarn 4 (checkout) ----------
      - name: Setup Node (yarn)
        if: matrix.lang == 'node-yarn'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build (Yarn)
        if: matrix.lang == 'node-yarn'
        run: |
          node .yarn/releases/yarn-4.11.0.cjs install --immutable
          node .yarn/releases/yarn-4.11.0.cjs build

      - name: Tests unitarios (Yarn)
        if: matrix.lang == 'node-yarn'
        run: node .yarn/releases/yarn-4.11.0.cjs test

      # ---------- Cobertura (todos) ----------
      - name: Ajustar rutas de la cobertura de Node
        # c8 escribe rutas relativas al servicio (SF:src/jsonlog.ts) y SonarCloud
        # las necesita relativas a la raíz del repo (SF:src/ui/src/jsonlog.ts).
        if: matrix.lang == 'node' || matrix.lang == 'node-yarn'
        env:
          SERVICE: ${{ matrix.service }}
        run: sed -i "s#^SF:#SF:src/${SERVICE}/#" coverage/lcov.info

      - name: Guardar reporte de cobertura (para SonarCloud)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.service }}
          path: |
            src/${{ matrix.service }}/coverage.out
            src/${{ matrix.service }}/coverage.xml
            src/${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  semgrep:
    name: semgrep
    # SAST (DEVOPS-34). Corre en paralelo con build-test, después de gitleaks.
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Para publicar los hallazgos en la pestaña Security > Code scanning.
      security-events: write
    env:
      SEMGREP_VERSION: 1.185.0
      # Reglas de la comunidad de Semgrep (registry semgrep.dev):
      #  - p/owasp-top-ten: lo que pide la letra (OWASP Top 10)
      #  - p/default: reglas generales de seguridad para Go, Python y JS/TS
      #  - p/dockerfile: buenas prácticas de seguridad en Dockerfiles
      SEMGREP_RULES: --config p/owasp-top-ten --config p/default --config p/dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Instalar Semgrep (versión fija)
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Reporte completo (todas las severidades)
        # Este paso no falla: genera el reporte SARIF con TODO lo que encuentra,
        # incluidos los hallazgos INFO, para revisarlos en Security y en el informe.
        run: |
          semgrep scan $SEMGREP_RULES --metrics=off \
            --sarif --output semgrep.sarif

      - name: Quality gate (falla con hallazgos ERROR o WARNING)
        # --error: sale con código 1 si queda algún hallazgo de esas severidades.
        # Los INFO no bloquean (ver docs/seguridad/semgrep.md).
        run: |
          semgrep scan $SEMGREP_RULES --metrics=off \
            --severity ERROR --severity WARNING \
            --error

      - name: Publicar hallazgos en GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14

  trivy-fs:
    name: trivy-fs
    # SCA (DEVOPS-32): CVEs conocidos en las dependencias de los 6 servicios
    # (go.mod, requirements.txt, package-lock.json, yarn.lock).
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: 0.76.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Binario con versión fija y checksum verificado, igual que Gitleaks. No usamos
      # aquasecurity/trivy-action: sus tags fueron movidos a código malicioso en un
      # ataque de cadena de suministro (lo cita la regla de Semgrep de DEVOPS-34).
      - name: Instalar Trivy (versión fija y checksum verificado)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$file" "$base/$file"
          curl --proto '=https' --tlsv1.2 -sSfL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" trivy
          ./trivy --version

      - name: Reporte completo (todas las severidades)
        # No falla: deja el SARIF con todo lo que encuentra (también MEDIUM/LOW
        # y los que no tienen parche) para Security y para el informe de hallazgos.
        run: |
          ./trivy fs . \
            --scanners vuln \
            --format sarif \
            --output trivy-fs.sarif

      - name: Quality gate (CRITICAL/HIGH con parche disponible)
        # --ignore-unfixed: no bloquea si todavía no existe versión corregida
        #                   (es lo que pide la letra: "con fix disponible").
        # --exit-code 1:    si queda alguno, el job falla y no se construyen imágenes.
        # Las excepciones justificadas van en .trivyignore.
        run: |
          ./trivy fs . \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Publicar hallazgos en GitHub Security
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-report
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 14

  sonarcloud:
    name: sonarcloud
    # Calidad de código (DEVOPS-38): bugs, code smells, vulnerabilidades,
    # security hotspots, duplicación y cobertura. La configuración está en
    # sonar-project.properties y los umbrales en docs/quality-gates.md.
    #
    # Corre en los PRs y en develop, no en release/* ni en main: el plan Free de
    # SonarCloud solo analiza la rama principal del proyecto (develop) y los PRs
    # ("Organization is not allowed to access data from non main branches").
    # No se pierde control: release/* sale de develop (o avanza en fast-forward
    # desde develop) y main recibe ese mismo código, así que el SHA que llega a
    # test y prod ya pasó este quality gate en develop.
    #
    # Se saltean los PASOS, no el job: si el job queda "skipped", todos los
    # jobs que dependen de él (docker-build, deploy-test, gate-prod...) también
    # se saltean. Así el job termina en verde y la cadena sigue.
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANALIZAR: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}
    steps:
      - name: Sin análisis en esta rama (plan Free)
        if: env.ANALIZAR != 'true'
        run: |
          echo "SonarCloud no analiza ${GITHUB_REF_NAME}: este SHA ya pasó el quality gate en develop." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout (historial completo)
        if: env.ANALIZAR == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud usa el historial (git blame) para saber qué código es "nuevo".
          fetch-depth: 0

      - name: Bajar reportes de cobertura de build-test
        if: env.ANALIZAR == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: Análisis de SonarCloud + quality gate
        if: env.ANALIZAR == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          # Token del proyecto en SonarCloud. Está en Settings > Secrets > Actions
          # (y también en Dependabot, para que corra en sus PRs). Nunca en el código.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Espera el resultado del quality gate: si da "Failed", el job falla
          # y no se construyen imágenes.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  integration:
    name: integration (newman con docker compose)
    # Tests de integración (DEVOPS-39) ANTES de publicar nada: levanta la tienda
    # completa en el runner (db, redis, catalog, carts, orders, checkout y ui)
    # y corre el flujo de compra de punta a punta a través del UI.
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (para correr Newman)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Crear .env con contraseñas descartables
        # Se generan en cada corrida y mueren con el runner: no hay nada que filtrar.
        run: |
          {
            echo "POSTGRES_USER=retail_user"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Levantar la tienda (docker compose)
        # "ui" arrastra sus dependencias; el panel admin no participa del flujo.
        run: docker compose up -d --build ui

      - name: Tests de integración (Newman)
        run: ./scripts/tests-integracion.sh http://localhost:8080

      - name: Logs de los contenedores (si falló)
        if: failure()
        run: |
          mkdir -p reports
          docker compose logs --no-color --timestamps | tee reports/compose.log

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newman-compose
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Bajar la tienda
        if: always()
        run: docker compose down -v

  docker-build:
    name: docker-build (${{ matrix.service }})
    # Solo se construyen imágenes si pasaron TODOS los gates: tests unitarios,
    # SAST (semgrep), SCA (trivy-fs), calidad (sonarcloud) e integración (newman).
    needs: [build-test, semgrep, trivy-fs, sonarcloud, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # subir el SARIF de Trivy image a GitHub Security
    env:
      TRIVY_VERSION: 0.76.1
      IMAGE: tero-${{ matrix.service }}:${{ github.sha }}
      # Se publica en ECR solo desde develop y release/*. main nunca publica:
      # prod usa la imagen que ya pasó por dev y test (build once, deploy many).
      PUBLICAR: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')) }}
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, cart, checkout, ui, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build de la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.service }}
          # Se carga en el Docker local del runner (no se publica todavía):
          # así se puede escanear antes del push (Trivy image, DEVOPS-33).
          load: true
          push: false
          # Tag = SHA del commit: la misma imagen se va a promover entre ambientes.
          tags: tero-${{ matrix.service }}:${{ github.sha }}
          # Caché de capas en GitHub Actions, un scope por servicio.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ---- Escaneo de la imagen ANTES de publicarla (DEVOPS-33).
      # Trivy fs (DEVOPS-32) ya revisó las dependencias declaradas; acá se revisa
      # la imagen final: paquetes del sistema operativo base (Alpine/Debian),
      # runtimes (node, python) y todo lo que realmente quedó adentro.

      - name: Instalar Trivy (versión fija y checksum verificado)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$file" "$base/$file"
          curl --proto '=https' --tlsv1.2 -sSfL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" trivy
          ./trivy --version

      - name: Trivy image - reporte completo
        # No falla: deja todo (todas las severidades) para Security y el informe.
        run: |
          ./trivy image "$IMAGE" \
            --scanners vuln \
            --format sarif \
            --output trivy-image.sarif

      - name: Trivy image - quality gate (CRITICAL/HIGH con parche)
        # Mismo criterio que Trivy fs. Si falla, los pasos de push no corren:
        # una imagen vulnerable nunca llega a ECR. Excepciones en .trivyignore.
        run: |
          ./trivy image "$IMAGE" \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Publicar hallazgos en GitHub Security
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-${{ matrix.service }}
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 14

      # ---- Publicación en ECR (DEVOPS-26): solo en push a develop o release/*, nunca en PRs.
      # En un PR el código todavía no fue revisado ni mergeado, y además los PRs
      # de forks no reciben secrets.

      - name: Credenciales de AWS (AWS Academy)
        if: env.PUBLICAR == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Academy da credenciales temporales: sin el session token no autentican.
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login a ECR
        if: env.PUBLICAR == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Push a ECR (tag = SHA del commit)
        if: env.PUBLICAR == 'true'
        env:
          LOCAL_IMAGE: ${{ env.IMAGE }}
          REMOTE_IMAGE: ${{ steps.ecr.outputs.registry }}/tero/${{ matrix.service }}:${{ github.sha }}
        run: |
          # Una rama release/* recién creada apunta al mismo commit que develop:
          # la imagen ya está publicada (y los repos son inmutables). No se pisa.
          if aws ecr describe-images --repository-name "tero/${{ matrix.service }}" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Ya estaba publicada \`$REMOTE_IMAGE\` (se reutiliza)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publicada \`$REMOTE_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: deploy-dev (CD a ECS)
    # CD a Dev (DEVOPS-27): solo después de un merge a develop y solo si las 6
    # imágenes pasaron todos los gates y quedaron publicadas en ECR.
    # Nunca en PRs, ni en release/* (test) ni en main (prod).
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ambiente de GitHub "dev": deja el historial de deploys en la pestaña
    # Deployments del repo, con el link a la tienda.
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    # La URL de la tienda en dev, para que integration-dev corra Newman contra ella.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # Un deploy a la vez: si se mergean dos PRs seguidos, el segundo espera al
    # primero en lugar de pisarlo a mitad de camino.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Credenciales de AWS (AWS Academy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Desplegar en ECS dev + smoke test
        id: deploy
        shell: bash # con pipefail: si el script falla, el "| tee" no lo tapa
        run: |
          # El script deja la URL de la tienda en $GITHUB_OUTPUT (url=...).
          ./scripts/desplegar-ecs.sh dev "$GITHUB_SHA" | tee deploy.log
          {
            echo "### Deploy a dev"
            echo '```'
            cat deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration-dev:
    name: integration-dev (newman contra dev)
    # La misma colección de Newman, ahora contra el ambiente real (ALB, ECS,
    # RDS y ElastiCache). Es el gate para promover esta versión a test (DEVOPS-29).
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (para correr Newman)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Tests de integración contra dev (Newman)
        env:
          BASE_URL: ${{ needs.deploy-dev.outputs.url }}
        run: ./scripts/tests-integracion.sh "$BASE_URL"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newman-dev
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # ===================== Promoción: test y prod (DEVOPS-28/29) =====================

  deploy-test:
    name: deploy-test (promoción a test)
    # Push a release/* (Git Flow): se despliega en test la imagen de ESTE commit,
    # la misma que ya corrió en dev. No se reconstruye nada.
    needs: docker-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # leer los runs anteriores para el gate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate dev -> test (integration-dev en verde para este SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verificar-gate.sh "$GITHUB_SHA" "integration-dev (newman contra dev)"

      - name: Credenciales de AWS (AWS Academy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Desplegar en ECS test + smoke test
        id: deploy
        shell: bash
        run: |
          ./scripts/desplegar-ecs.sh test "$GITHUB_SHA" | tee deploy.log
          { echo "### Deploy a test"; echo '```'; cat deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: integration-test (newman contra test)
    # Tests de integración contra test. Es el gate para promover a prod.
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (para correr Newman)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Tests de integración contra test (Newman)
        env:
          BASE_URL: ${{ needs.deploy-test.outputs.url }}
        run: ./scripts/tests-integracion.sh "$BASE_URL"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newman-test
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  gate-prod:
    name: gate-prod (qué versión se promueve)
    # Push a main = merge de un PR release/* -> main. El commit de main es un
    # merge nuevo (otro SHA, sin imagen): se promueve el commit de la rama
    # release, que es el 2do padre del merge. Se valida ANTES de pedir la
    # aprobación, así quien aprueba ve en el resumen qué SHA va a prod.
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SHA a promover (2do padre del merge)
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.parents[1].sha // empty')"
          if [[ -z "$sha" ]]; then
            echo "::error::${GITHUB_SHA} no es un merge commit. A main se llega con un PR desde release/* mergeado con 'Create a merge commit' (no squash ni rebase)."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "### Se promueve a prod \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate test -> prod (integration-test en verde para ese SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verificar-gate.sh "${{ steps.sha.outputs.sha }}" "integration-test (newman contra test)"

  deploy-prod:
    name: deploy-prod (promoción a prod)
    # Aprobación manual: environment "production" con required reviewers. El
    # job queda en pausa ("Waiting") hasta que alguien toca Review deployments.
    needs: gate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Credenciales de AWS (AWS Academy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Desplegar en ECS prod + smoke test
        id: deploy
        shell: bash
        env:
          SHA: ${{ needs.gate-prod.outputs.sha }}
        run: |
          ./scripts/desplegar-ecs.sh prod "$SHA" | tee deploy.log
          { echo "### Deploy a prod"; echo '```'; cat deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  smoke-prod:
    name: smoke-prod (newman solo lectura)
    # En prod no se crean órdenes de prueba: solo la carpeta de lectura.
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (para correr Newman)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Smoke test de prod (Newman, solo lectura)
        env:
          BASE_URL: ${{ needs.deploy-prod.outputs.url }}
        run: ./scripts/tests-integracion.sh "$BASE_URL" "01 Solo lectura (health y catálogo)"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newman-prod
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
