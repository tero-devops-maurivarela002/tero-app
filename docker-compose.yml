services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: orders
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante el init el server temporal solo escucha en socket Unix
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # db y redis no publican puertos en el host: solo los ven los demás
  # servicios por la red interna de compose (db:5432, redis:6379).
  redis:
    image: redis:7-alpine

  catalog:
    build:
      context: ./src/catalog
    environment:
      GIN_MODE: release
      RETAIL_CATALOG_PERSISTENCE_PROVIDER: postgres
      RETAIL_CATALOG_PERSISTENCE_ENDPOINT: db:5432
      RETAIL_CATALOG_PERSISTENCE_DB_NAME: catalogdb
      RETAIL_CATALOG_PERSISTENCE_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      RETAIL_CATALOG_PERSISTENCE_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  carts:
    build:
      context: ./src/cart
    environment:
      CART_PERSISTENCE_PROVIDER: postgres
      CART_POSTGRES_HOST: db
      CART_POSTGRES_PORT: "5432"
      CART_POSTGRES_DB: cartdb
      CART_POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      CART_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      PORT: "8080"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  orders:
    build:
      context: ./src/orders
    environment:
      GIN_MODE: release
      RETAIL_ORDERS_PERSISTENCE_ENDPOINT: db:5432
      RETAIL_ORDERS_PERSISTENCE_NAME: orders
      RETAIL_ORDERS_PERSISTENCE_USERNAME: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      RETAIL_ORDERS_PERSISTENCE_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  checkout:
    build:
      context: ./src/checkout
    environment:
      RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: redis://redis:6379
      RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders:8080
    restart: on-failure
    depends_on:
      - redis
      - orders

  ui:
    build:
      context: ./src/ui
    environment:
      RETAIL_UI_ENDPOINTS_CATALOG:  http://catalog:8080
      RETAIL_UI_ENDPOINTS_CARTS:    http://carts:8080
      RETAIL_UI_ENDPOINTS_CHECKOUT: http://checkout:8080
      RETAIL_UI_ENDPOINTS_ORDERS:   http://orders:8080
    ports:
      - "8080:8080"
    depends_on:
      - catalog
      - carts
      - orders
      - checkout

  admin:
    build:
      context: ./src/admin
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Falta ADMIN_USERNAME en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Falta ADMIN_JWT_SECRET en .env}
    ports:
      - "8081:8080"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
