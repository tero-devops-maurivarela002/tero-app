# Configuración de SonarCloud (DEVOPS-38)
# Umbrales y su justificación: docs/quality-gates.md

# --- Identificación del proyecto en SonarCloud (no son secretos) ---
sonar.organization=tero-devops-maurivarela002
sonar.projectKey=tero-devops-maurivarela002_tero-app
sonar.projectName=tero-app

# --- Qué se analiza ---
# Código fuente: los 6 microservicios.
sonar.sources=src
# Tests: mismos directorios, pero solo los archivos de test.
sonar.tests=src
sonar.test.inclusions=**/*_test.go,src/cart/tests/**

# Fuera del análisis: tests (van en sonar.tests), dependencias, artefactos,
# el binario de Yarn y los datos de ejemplo.
sonar.exclusions=**/*_test.go,src/cart/tests/**,**/node_modules/**,**/dist/**,src/checkout/.yarn/**,**/*.json,**/*.lock,**/go.sum

# Fuera de la detección de duplicados: el logger JSON (DEVOPS-48) se repite a
# propósito en cada servicio, porque cada uno se construye por separado
# (no hay una librería compartida entre Go, Node y Python).
sonar.cpd.exclusions=**/jsonlog.go,**/jsonlog.ts

# --- Cobertura (la generan los jobs build-test y la baja el job sonarcloud) ---
sonar.go.coverage.reportPaths=coverage/coverage-catalog/coverage.out,coverage/coverage-orders/coverage.out
sonar.python.coverage.reportPaths=coverage/coverage-cart/coverage.xml
sonar.python.version=3.12

sonar.sourceEncoding=UTF-8
